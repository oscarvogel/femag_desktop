name: Publish FEMAG production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout FEMAG
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-web.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Validate release token
        shell: pwsh
        env:
          VOGEL_RELEASES_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOGEL_RELEASES_TOKEN)) {
            throw 'Falta el secret VOGEL_RELEASES_TOKEN'
          }

      - name: Build production executable and installer
        id: build
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\scripts\build_production_installer.ps1 -SkipInstallDependencies -PythonPath $python
          $version = (Get-Content app\build_info.py | Select-String -Pattern 'BUILD_VERSION = "(.+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'No se pudo obtener BUILD_VERSION' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Frozen executable smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'femag-smoke-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:LOCALAPPDATA = $runtime
          & '.\dist\FEMAG Desktop\FEMAG Desktop.exe' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'El EXE congelado no paso el smoke test' }

      - name: Configuration and secret safety check
        shell: pwsh
        run: |
          $forbidden = @('*.ini', '.env', '*.env', '*secret*', '*credential*')
          $roots = @('dist\FEMAG Desktop', 'installer\output')
          foreach ($root in $roots) {
            foreach ($pattern in $forbidden) {
              $matches = Get-ChildItem $root -Recurse -Force -File -Filter $pattern -ErrorAction SilentlyContinue
              if ($matches) {
                $matches | ForEach-Object { Write-Error "Archivo prohibido en artefacto: $($_.FullName)" }
                throw 'El build contiene configuracion o secretos prohibidos'
              }
            }
          }
          if (Test-Path '.env') { throw 'Existe .env en el workspace de publicacion' }

      - name: Calculate SHA256
        id: hash
        shell: pwsh
        run: |
          $file = 'installer\output\FEMAG_Desktop_Produccion_Setup.exe'
          if (-not (Test-Path $file)) { throw "No existe $file" }
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout public release repository
        uses: actions/checkout@v4
        with:
          repository: oscarvogel/vogel-releases
          token: ${{ secrets.VOGEL_RELEASES_TOKEN }}
          path: vogel-releases

      - name: Ensure permanent latest release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          gh release view latest --repo oscarvogel/vogel-releases *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo oscarvogel/vogel-releases --title 'Vogel Releases - Latest' --notes 'Últimos instaladores publicados.'
          }

      - name: Replace FEMAG installer asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          gh release upload latest installer\output\FEMAG_Desktop_Produccion_Setup.exe --clobber --repo oscarvogel/vogel-releases

      - name: Update only FEMAG manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          $manifestDir = 'vogel-releases\apps\femag'
          New-Item -ItemType Directory -Force $manifestDir | Out-Null
          $payload = [ordered]@{
            schema_version = 1
            app_id = 'femag'
            version = $env:VERSION
            published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            mandatory = $false
            download_url = 'https://github.com/oscarvogel/vogel-releases/releases/download/latest/FEMAG_Desktop_Produccion_Setup.exe'
            sha256 = $env:SHA256
            notes = 'Nueva versión de FEMAG disponible.'
          }
          $json = $payload | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $manifestPath = Join-Path $manifestDir 'latest.json'
          [System.IO.File]::WriteAllText($manifestPath, $json, $utf8NoBom)
          $bytes = [System.IO.File]::ReadAllBytes($manifestPath)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            throw 'latest.json fue escrito con BOM'
          }
          Set-Location vogel-releases
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/femag/latest.json
          $unexpected = git diff --cached --name-only | Where-Object { $_ -ne 'apps/femag/latest.json' }
          if ($unexpected) { throw "Se intentan publicar archivos ajenos a FEMAG: $unexpected" }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release(femag): $env:VERSION"
            git push
          }
