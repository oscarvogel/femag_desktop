name: Publish FEMAG candidate

on:
  workflow_dispatch:

concurrency:
  group: femag-candidate-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-validate-publish-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_REPO: oscarvogel/vogel-releases
      RELEASE_TAG: femag-candidate
      INSTALLER_NAME: FEMAG_Desktop_Produccion_Setup.exe

    steps:
      - name: Checkout FEMAG
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-web.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall app

      - name: Validate release token
        shell: pwsh
        env:
          VOGEL_RELEASES_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VOGEL_RELEASES_TOKEN)) {
            throw 'Falta el secret VOGEL_RELEASES_TOKEN'
          }

      - name: Build production executable and installer
        id: build
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\scripts\build_production_installer.ps1 -SkipInstallDependencies -PythonPath $python
          $version = (Get-Content app\build_info.py | Select-String -Pattern 'BUILD_VERSION = "(.+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'No se pudo obtener BUILD_VERSION' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Frozen executable smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'femag-smoke-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:LOCALAPPDATA = $runtime
          $exe = Resolve-Path '.\dist\FEMAG Desktop\FEMAG Desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "El EXE congelado no paso el smoke test: $($process.ExitCode)" }

      - name: Frozen production health check
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FEMAG_HEALTH_CHECK_CI: '1'
          FEMAG_HEALTH_CHECK_SKIP_SCHEMA: '1'
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'femag-health-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:LOCALAPPDATA = $runtime
          $exe = Resolve-Path '.\dist\FEMAG Desktop\FEMAG Desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--production-health-check' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "El EXE congelado no paso production-health-check: $($process.ExitCode)" }

      - name: Configuration and secret safety check
        shell: pwsh
        run: |
          $forbidden = @('*.ini', '.env', '*.env', '*secret*', '*credential*', '*.pem', '*.key')
          $roots = @('dist\FEMAG Desktop', 'installer\output')
          foreach ($root in $roots) {
            foreach ($pattern in $forbidden) {
              $matches = Get-ChildItem $root -Recurse -Force -File -Filter $pattern -ErrorAction SilentlyContinue
              if ($matches) {
                $matches | ForEach-Object { Write-Error "Archivo prohibido en artefacto: $($_.FullName)" }
                throw 'El build contiene configuracion o secretos prohibidos'
              }
            }
          }
          if (Test-Path '.env') { throw 'Existe .env en el workspace de publicacion' }

      - name: Clean install and upgrade validation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          FEMAG_HEALTH_CHECK_CI: '1'
          FEMAG_HEALTH_CHECK_SKIP_SCHEMA: '1'
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'femag-clean-install'
          $localAppData = Join-Path $env:RUNNER_TEMP 'femag-clean-localappdata'
          New-Item -ItemType Directory -Force $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData
          $runtime = Join-Path $localAppData 'FEMAG Desktop'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $marker = Join-Path $runtime 'installer-preserve.marker'
          Set-Content -Path $marker -Value 'preserve-me' -NoNewline

          $installer = Resolve-Path 'installer\output\FEMAG_Desktop_Produccion_Setup.exe'
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installRoot")
          $process = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Falló instalación limpia: $($process.ExitCode)" }
          $installedExe = Join-Path $installRoot 'FEMAG Desktop.exe'
          if (-not (Test-Path $installedExe)) { throw 'No se encontró el ejecutable instalado' }
          if ((Get-Content -Raw $marker) -ne 'preserve-me') { throw 'El instalador alteró el área runtime/config local' }

          $healthProcess = Start-Process -FilePath $installedExe -ArgumentList '--production-health-check' -PassThru -Wait
          if ($healthProcess.ExitCode -ne 0) { throw "La instalación real no pasó production-health-check: $($healthProcess.ExitCode)" }

          $process2 = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          if ($process2.ExitCode -ne 0) { throw "Falló reinstalación/upgrade: $($process2.ExitCode)" }
          if ((Get-Content -Raw $marker) -ne 'preserve-me') { throw 'El upgrade alteró el área runtime/config local' }

      - name: Calculate SHA256
        id: hash
        shell: pwsh
        run: |
          $file = 'installer\output\FEMAG_Desktop_Produccion_Setup.exe'
          if (-not (Test-Path $file)) { throw "No existe $file" }
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout public release repository
        uses: actions/checkout@v4
        with:
          repository: oscarvogel/vogel-releases
          token: ${{ secrets.VOGEL_RELEASES_TOKEN }}
          path: vogel-releases

      - name: Publish exact validated build as candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:RELEASE_REPO --title 'FEMAG candidate' --notes 'Validated FEMAG candidate. Do not distribute as production.'
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el release candidate.' }
          }

          # Un error transitorio de GitHub (por ejemplo HTTP 500 al reemplazar el
          # asset con --clobber) no debe dejar el manifest apuntando a bytes que
          # no existen. Reintentamos y si sigue fallando, abortamos antes de
          # escribir candidate.json. Ver #839.
          $uploadOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $env:RELEASE_TAG "installer\output\$env:INSTALLER_NAME" --repo $env:RELEASE_REPO --clobber
            if ($LASTEXITCODE -eq 0) { $uploadOk = $true; break }
            Write-Host "Subida del asset fallo (intento $attempt/3, exit=$LASTEXITCODE)."
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $uploadOk) { throw 'No se pudo subir el instalador candidate despues de 3 intentos. No se publica el manifest.' }

          # Verificar los bytes realmente publicados antes de commitear el manifest.
          $verifyDir = Join-Path $env:RUNNER_TEMP ("femag-asset-verify-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $verifyDir | Out-Null
          $remoteSha = ''
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPO --pattern $env:INSTALLER_NAME --dir $verifyDir --clobber
            $downloaded = Join-Path $verifyDir $env:INSTALLER_NAME
            if ($LASTEXITCODE -eq 0 -and (Test-Path $downloaded)) {
              $remoteSha = (Get-FileHash $downloaded -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($remoteSha -eq $env:SHA256) { break }
              Write-Host "El SHA remoto no coincide (intento $attempt/3): remoto=$remoteSha esperado=$env:SHA256"
            }
            else {
              Write-Host "La descarga de verificacion fallo (intento $attempt/3, exit=$LASTEXITCODE)."
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if ($remoteSha -ne $env:SHA256) {
            throw "El asset remoto no coincide con el SHA256 calculado. remoto=$remoteSha esperado=$env:SHA256. No se publica el manifest."
          }

          $manifestDir = 'vogel-releases\apps\femag'
          New-Item -ItemType Directory -Force $manifestDir | Out-Null
          $payload = [ordered]@{
            schema_version = 1
            app_id = 'femag'
            channel = 'candidate'
            version = $env:VERSION
            published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            validated_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            source_sha = $env:SOURCE_SHA
            mandatory = $false
            download_url = "https://github.com/$env:RELEASE_REPO/releases/download/$env:RELEASE_TAG/$env:INSTALLER_NAME"
            sha256 = $env:SHA256
            notes = "Candidate FEMAG $env:VERSION validado automáticamente."
          }
          $json = $payload | ConvertTo-Json
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $manifestPath = Join-Path $manifestDir 'candidate.json'
          [System.IO.File]::WriteAllText($manifestPath, $json, $utf8NoBom)

          Set-Location vogel-releases
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/femag/candidate.json
          $unexpected = git diff --cached --name-only | Where-Object { $_ -ne 'apps/femag/candidate.json' }
          if ($unexpected) { throw "Candidate intentó modificar archivos inesperados: $unexpected" }
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release(femag): candidate $env:VERSION"
            git push
          }
