name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Tests, compile and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        # La suite completa es la del escritorio: incluye tests de UI con
        # PyQt5. `requirements-web.txt` ya no arrastra `requirements.txt` (el
        # servidor de la fabrica no necesita PyQt ni Git), asi que las dos
        # listas se instalan explicitamente.
        run: python -m pip install -r requirements.txt -r requirements-web.txt

      - name: Show ORM version
        run: python -c "import peewee; print('peewee', peewee.__version__)"

      - name: Check diff whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"..HEAD
          else
            git diff --check "${{ github.event.before }}"..HEAD
          fi

      - name: Compile Python sources
        run: python -m compileall app webapp

      - name: Run tests
        run: python -m pytest

      - name: Run smoke check
        run: python -m app.main --smoke

  webapp-only:
    name: Webapp server dependencies only
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only the webapp dependencies
        # Esto es exactamente lo que va instalado en el Windows Server 2019:
        # ni PyQt, ni Git, ni salida a internet. Si esta lista vuelve a
        # arrastrar el escritorio, el servidor de la fabrica lo va a necesitar
        # y este job lo tiene que avisar.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt -r requirements-test.txt

      - name: The webapp does not need the desktop stack
        run: |
          if python -c "import PyQt5" 2> /dev/null; then
            echo "::error::El servidor webapp no debe depender de PyQt"
            exit 1
          fi
          python -c "import webapp; print('la webapp importa sin PyQt')"

      - name: Run the webapp tests
        # El glob lo expande la shell: la lista de tests de la webapp cambia
        # con cada PR y una lista fija hacia fallar el job en la rama donde
        # todavia no existe el archivo.
        run: python -m pytest tests/test_webapp_*.py -q

  webapp-container:
    name: Webapp container build and health
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build webapp image
        run: docker build -f deploy/coolify/Dockerfile -t femag-web:ci .

      - name: Start webapp container with demo data
        run: |
          docker run -d --name femag-web-ci \
            -p 18000:8000 \
            -e FEMAG_DB_ENGINE=sqlite \
            -e FEMAG_DEMO=1 \
            -e FEMAG_SECURE_CONFIG=0 \
            -e FEMAG_SQLITE_PATH=/tmp/femag_web_ci.sqlite3 \
            -e FEMAG_WEB_AUTO_INIT_SCHEMA=1 \
            -e FEMAG_WEB_SEED_DEMO=1 \
            -e FEMAG_WEB_DEMO_ADMIN_PASSWORD=ci-demo-pass-123 \
            -e FEMAG_WEB_SECRET_KEY=ci-container-secret \
            -e FEMAG_WEB_PUBLIC_URL=http://127.0.0.1:18000 \
            femag-web:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker logs femag-web-ci
          exit 1

      - name: Smoke pages and demo order
        run: |
          python - <<'PY'
          import json
          import urllib.request

          health = json.load(urllib.request.urlopen("http://127.0.0.1:18000/health"))
          assert health == {"database": True, "status": "ok"}, health
          for path in ("/login", "/orden/demo-web-order-2026"):
              with urllib.request.urlopen(f"http://127.0.0.1:18000{path}") as response:
                  assert response.status == 200, (path, response.status)
          print("container smoke OK")
          PY

      - name: Container logs
        if: always()
        run: docker logs femag-web-ci

      - name: Stop container
        if: always()
        run: docker rm -f femag-web-ci

  frozen-windows:
    name: Windows frozen EXE and installer smoke
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-web.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests on Windows
        shell: powershell
        run: python -m pytest -q

      - name: Build production installer
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          .\scripts\build_production_installer.ps1 -SkipInstallDependencies -PythonPath $python

      - name: Smoke frozen executable
        shell: powershell
        env:
          FEMAG_DISABLE_UPDATE_CHECK: "1"
        run: |
          $process = Start-Process -FilePath ".\dist\FEMAG Desktop\FEMAG Desktop.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen smoke failed with exit code $($process.ExitCode)" }
          Write-Host "Frozen FEMAG smoke OK (exit code 0)"

      - name: Build frozen webapp server executable
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean installer\FEMAG_Webapp_Server.spec

      - name: Smoke frozen webapp server executable
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'femag-webapp-server-smoke'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $env:FEMAG_CONFIG_DIR = $runtime
          $process = Start-Process -FilePath ".\dist\FEMAG Webapp Server\FEMAG Webapp Server.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen webapp server smoke failed with exit code $($process.ExitCode)" }
          Write-Host "Frozen webapp server smoke OK (exit code 0)"

      - name: Verify frozen webapp server resources
        shell: powershell
        run: |
          $dist = Resolve-Path ".\dist\FEMAG Webapp Server"
          $exe = Join-Path $dist "FEMAG Webapp Server.exe"
          if (-not (Test-Path $exe)) { throw "Missing frozen FEMAG Webapp Server.exe" }

          $templates = Get-ChildItem $dist -Recurse -File -Filter "*.html" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]webapp[\\/]templates[\\/]' }
          if (-not $templates) { throw "Las plantillas de Flask no se empaquetaron" }

          $pyqt = Get-ChildItem $dist -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)pyqt' }
          if ($pyqt) { throw "El paquete del servidor no debe traer PyQt: $($pyqt[0].FullName)" }

          $fonts = Get-ChildItem $dist -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]reportlab[\\/]fonts[\\/]' }
          if (-not $fonts) { throw "No se empaquetaron las fuentes de reportlab; la hoja de QR no saldria" }

      - name: Build webapp server installer
        shell: powershell
        run: |
          # El instalador lleva el ejecutable congelado: si este paso compila,
          # el paquete que se copia a la fabrica esta completo.
          . .\scripts\Resolve-InnoSetup.ps1
          $iscc = Resolve-InnoSetup -NoAutoInstall
          & $iscc "/DMyAppVersion=1.0.0" "installer\FEMAG_Webapp_Server.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallo al compilar el instalador del servidor webapp" }

          $setup = "installer\output\FEMAG_Webapp_Server_Setup.exe"
          if (-not (Test-Path $setup)) { throw "No se genero el instalador del servidor webapp" }
          Write-Host "Webapp server installer OK: $setup"

      - name: Build sync agent executable
        shell: powershell
        run: python -m PyInstaller --noconfirm --clean installer\FEMAG_Sync_Agent.spec

      - name: Smoke frozen sync agent
        shell: powershell
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'femag-sync-agent-smoke'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $config = Join-Path $runtime 'sync.env'
          $db = Join-Path $runtime 'sync.sqlite3'
          $lines = @(
            "FEMAG_DB_ENGINE=sqlite",
            "FEMAG_SQLITE_PATH=$db",
            "FEMAG_DEMO=1",
            "FEMAG_SECURE_CONFIG=0",
            "FEMAG_SYNC_BASE_URL=https://example.com",
            "FEMAG_SYNC_API_TOKEN=test",
            "FEMAG_SYNC_LOG_FILE=$(Join-Path $runtime 'sync.log')"
          )
          [System.IO.File]::WriteAllLines($config, $lines, (New-Object System.Text.UTF8Encoding($false)))
          $env:FEMAG_SYNC_ENV_FILE = $config
          $env:FEMAG_ENV_FILE = $config
          $env:FEMAG_DB_ENGINE = 'sqlite'
          $env:FEMAG_SQLITE_PATH = $db
          $env:FEMAG_DEMO = '1'
          $env:FEMAG_SECURE_CONFIG = '0'
          $init = Start-Process -FilePath ".\dist\FEMAG Sync Agent\FEMAG Sync Agent.exe" -ArgumentList "--init-schema" -Wait -PassThru
          if ($init.ExitCode -ne 0) { throw "Sync agent schema init failed with exit code $($init.ExitCode)" }
          $process = Start-Process -FilePath ".\dist\FEMAG Sync Agent\FEMAG Sync Agent.exe" -ArgumentList "--status" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Sync agent smoke failed with exit code $($process.ExitCode)" }
          $pyqt = Get-ChildItem ".\dist\FEMAG Sync Agent" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(?i)pyqt' }
          if ($pyqt) { throw "El agente no debe incluir PyQt: $($pyqt[0].FullName)" }
          Write-Host "Frozen sync agent smoke OK"

      - name: Build sync agent installer
        shell: powershell
        run: |
          . .\scripts\Resolve-InnoSetup.ps1
          $iscc = Resolve-InnoSetup -NoAutoInstall
          & $iscc "/DMyAppVersion=1.0.0" "installer\FEMAG_Sync_Agent.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fallo al compilar el instalador del agente de sync" }
          if (-not (Test-Path "installer\output\FEMAG_Sync_Agent_Setup.exe")) { throw "No se genero el instalador del agente de sync" }
          Write-Host "Sync agent installer OK"

      - name: Verify required frozen resources
        shell: powershell
        run: |
          $dist = Resolve-Path ".\dist\FEMAG Desktop"
          $exe = Join-Path $dist "FEMAG Desktop.exe"
          $installer = ".\installer\output\FEMAG_Desktop_Produccion_Setup.exe"
          if (-not (Test-Path $exe)) { throw "Missing frozen FEMAG Desktop.exe" }
          if (-not (Test-Path $installer)) { throw "Missing production installer" }

          $qtPlugins = Get-ChildItem $dist -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'platforms|PyQt5|Qt5' }
          if (-not $qtPlugins) { throw "PyQt5/Qt runtime resources were not packaged" }

          $fonts = Get-ChildItem $dist -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -match '^\.(ttf|otf)$' -or $_.FullName -match '[\\/]fonts[\\/]' }
          if (-not $fonts) { throw "No font resources were packaged; QFontDatabase regression risk" }

      - name: Reject config and secret material from artifacts
        shell: powershell
        run: |
          $roots = @(".\dist\FEMAG Desktop", ".\installer\output")
          $forbiddenNames = @('.env', 'sistema.ini', 'sistema-fg.ini', 'connection.json', 'connection.credential')
          foreach ($root in $roots) {
            Get-ChildItem $root -Recurse -File | ForEach-Object {
              if ($forbiddenNames -contains $_.Name.ToLowerInvariant()) {
                throw "Forbidden configuration file packaged: $($_.FullName)"
              }
            }
          }

      - name: Upload E2E installer artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: FEMAG_Produccion_PR-${{ github.event.pull_request.number }}
          path: installer/output/FEMAG_Desktop_Produccion_Setup.exe
          if-no-files-found: error
          retention-days: 7
