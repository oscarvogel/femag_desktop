name: Issue 319 debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUNBUFFERED: "1"

jobs:
  targeted:
    name: Targeted UI regression diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Issue 319 tests
        run: python -m pytest -vv -s tests/test_issue_319_product_code.py
      - name: Load-order regression
        run: python -m pytest -vv -s tests/test_load_order_desktop_ui.py::test_load_order_page_shows_issue_failure_above_table_as_error_banner
      - name: Client ABM regression
        run: python -m pytest -vv -s tests/test_master_abm_desktop_ui.py::test_clients_abm_page_creates_edits_and_refreshes_grid
