name: Publish FEMAG production release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Notas visibles para los usuarios
        required: false
        default: Nueva versión de FEMAG disponible.
      mandatory:
        description: Marcar actualización como obligatoria
        type: boolean
        required: false
        default: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout FEMAG
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        shell: powershell
        run: python -m pytest -q

      - name: Build production installer
        id: build
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          .\scripts\build_production_installer.ps1 -SkipInstallDependencies -PythonPath $python
          $version = (Get-Content app\build_version.py | Select-String -Pattern 'BUILD_VERSION = "(.+)"').Matches.Groups[1].Value
          if (-not $version) { throw 'No se pudo obtener BUILD_VERSION' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Calculate SHA256
        id: hash
        shell: powershell
        run: |
          $file = 'installer\output\FEMAG_Desktop_Produccion_Setup.exe'
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checkout public release repository
        uses: actions/checkout@v4
        with:
          repository: oscarvogel/vogel-releases
          token: ${{ secrets.VOGEL_RELEASES_TOKEN }}
          path: vogel-releases

      - name: Ensure permanent latest release exists
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          gh release view latest --repo oscarvogel/vogel-releases 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo oscarvogel/vogel-releases --title 'Vogel Releases - Latest' --notes 'Últimos instaladores publicados.'
          }

      - name: Replace FEMAG installer asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.VOGEL_RELEASES_TOKEN }}
        run: |
          gh release upload latest installer\output\FEMAG_Desktop_Produccion_Setup.exe --clobber --repo oscarvogel/vogel-releases

      - name: Update FEMAG manifest
        shell: powershell
        env:
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
          RELEASE_NOTES: ${{ inputs.notes }}
          MANDATORY: ${{ inputs.mandatory }}
        run: |
          $manifestDir = 'vogel-releases\apps\femag'
          New-Item -ItemType Directory -Force $manifestDir | Out-Null
          $payload = [ordered]@{
            schema_version = 1
            app_id = 'femag'
            version = $env:VERSION
            published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            mandatory = ($env:MANDATORY -eq 'true')
            download_url = 'https://github.com/oscarvogel/vogel-releases/releases/download/latest/FEMAG_Desktop_Produccion_Setup.exe'
            sha256 = $env:SHA256
            notes = $env:RELEASE_NOTES
          }
          $payload | ConvertTo-Json | Set-Content -Encoding UTF8 "$manifestDir\latest.json"
          Set-Location vogel-releases
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/femag/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release(femag): publish $env:VERSION"
            git push
          }
