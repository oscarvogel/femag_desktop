<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FEMAG{% endblock %}</title>
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18212b; background: #f3f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #17324d; color: white; padding: 16px 20px; }
    header strong { font-size: 1.15rem; }
    main { max-width: 760px; margin: 0 auto; padding: 18px 14px 40px; }
    .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    p { margin: 6px 0; }
    .muted { color: #687481; font-size: .92rem; }
    label { display: block; font-weight: 650; margin: 12px 0 5px; }
    input { width: 100%; min-height: 46px; border: 1px solid #b8c1ca; border-radius: 9px; padding: 10px 12px; font-size: 1rem; }
    button, .button { display: inline-block; width: 100%; min-height: 48px; border: 0; border-radius: 9px; padding: 12px 16px; font-size: 1rem; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; background: #17324d; color: white; }
    .message { border-radius: 9px; padding: 11px 12px; margin-bottom: 14px; }
    .message.success { background: #e7f6ed; color: #215b38; }
    .message.error { background: #fdecec; color: #852d2d; }
    .line { border-top: 1px solid #e4e8ec; padding-top: 14px; margin-top: 14px; }
    .line:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
    .summary div span { display: block; color: #687481; font-size: .8rem; text-transform: uppercase; }
    @media (max-width: 520px) { .summary { grid-template-columns: 1fr; } main { padding: 14px 10px 30px; } }
  </style>
</head>
<body>
<header><strong>FEMAG · Despachos</strong></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
