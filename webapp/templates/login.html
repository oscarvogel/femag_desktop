{% extends "base.html" %}
{% block title %}Iniciar sesión · FEMAG{% endblock %}
{% block content %}
<div class="card">
  <h1>Iniciar sesión</h1>
  <p class="muted">Usá tu usuario de FEMAG. El parte de producción queda a nombre de quien lo carga.</p>
  <form method="post">
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div style="height:16px"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
